name: Fetch and Upload Edinet

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Domain
        run: pnpm --filter stock-analyze-domain run build

      - name: Restore Data Cache
        uses: actions/cache/restore@v5
        with:
          path: data
          key: data-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            data-linux-${{ github.run_id }}-
            data-linux-

      - name: Fetch EDINET
        run: pnpm --filter stock-analyze-collector run run:fetch-edinet
        env:
          NODE_ENV: production

      - name: Upload EDINET to Databricks
        run: pnpm --filter stock-analyze-databricks run upload:edinet
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Fetch Large Shareholdings
        run: pnpm --filter stock-analyze-collector run run:fetch-large-shareholdings
        env:
          NODE_ENV: production

      - name: Upload Large Shareholdings to Databricks
        run: pnpm --filter stock-analyze-databricks run upload:large-shareholdings
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Save Data Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data
          key: data-linux-${{ github.run_id }}-${{ github.run_attempt }}
