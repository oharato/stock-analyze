name: Fetch and Upload Stock Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # JST 5:00 (UTC 20:00) - Before market opens or strictly for daily updates

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Domain
        run: pnpm --filter stock-analyze-domain run build

      - name: Restore Data Cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            data-linux-${{ github.run_id }}-
            data-linux-

      - name: Fetch Stock List
        run: pnpm --filter stock-analyze-collector run run:fetch-stock-list
        env:
          NODE_ENV: production

      - name: Upload Stock List to Databricks
        run: pnpm --filter stock-analyze-databricks run upload:stock-list
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Fetch Stock Prices
        run: pnpm --filter stock-analyze-collector run run:fetch-stock-prices
        env:
          # Add any necessary environment variables for the collector here
          NODE_ENV: production

      - name: Upload Prices to Databricks
        run: pnpm --filter stock-analyze-databricks run upload:price
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # Optional: Override destination path if needed
          # DATABRICKS_DESTINATION_PATH: /Volumes/main/default/prices

      - name: Save Data Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-linux-${{ github.run_id }}-${{ github.run_attempt }}
