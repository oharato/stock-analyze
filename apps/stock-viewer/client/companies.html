<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companies - Stock Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/styles/custom.css">
    <link rel="icon" href="/favicon.ico">
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body x-data="companiesPage" x-init="init()">
    <nav class="sidebar" x-data="sidebar" x-init="init()">
        <h2>Stock Viewer</h2>
        <ul>
            <template x-for="table in tables" :key="table">
                <li>
                    <button class="outline" :class="table === 'companies' ? '' : 'secondary'" @click="navigate(table)"
                        x-text="table"></button>
                </li>
            </template>
        </ul>
    </nav>

    <main>
        <header>
            <h1>企業一覧</h1>
        </header>

        <section class="filter-container">
            <div class="filter-row">
                <input type="search" x-model="filterQuery" @input.debounce.300ms="applyFilter()"
                    placeholder="銘柄コードまたは会社名で検索...">
                <select x-model="chartMode" @change="onChartModeChange()">
                    <option value="none">チャート表示: なし</option>
                    <option value="daily">チャート表示: 日足</option>
                    <option value="weekly">チャート表示: 週足</option>
                    <option value="monthly">チャート表示: 月足</option>
                </select>
                <button type="button" class="secondary" @click="clearAllFilters()">クリア</button>
            </div>
            <div class="filter-dropdowns">
                <template x-for="type in ['market', 'sector33', 'sector17', 'scale']" :key="type">
                    <details class="dropdown">
                        <summary>
                            <span
                                x-text="type === 'market' ? '市場' : type === 'sector33' ? '業種(33)' : type === 'sector17' ? '業種(17)' : '規模'"></span>
                            <span x-show="selectedFilters[type].length > 0"
                                x-text="'(' + selectedFilters[type].length + ')'"></span>
                        </summary>
                        <ul>
                            <template x-for="option in filterOptions[type]" :key="option">
                                <li>
                                    <label>
                                        <input type="checkbox" :checked="selectedFilters[type].includes(option)"
                                            @change="toggleFilter(type, option)">
                                        <span x-text="option"></span>
                                    </label>
                                </li>
                            </template>
                        </ul>
                    </details>
                </template>
            </div>
        </section>

        <template x-if="loadingData">
            <p aria-busy="true">データ読み込み中...</p>
        </template>

        <template x-if="columns.length > 0">
            <div class="content-area">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>code</th>
                                <th class="name-column">name</th>
                                <template x-if="chartMode === 'none'">
                                    <template x-for="col in columns.filter(c => !['code', 'name'].includes(c))"
                                        :key="col">
                                        <th x-text="col"></th>
                                    </template>
                                </template>
                                <template x-if="chartMode !== 'none'">
                                    <th style="min-width: 450px;">チャート</th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="row in data" :key="row.code">
                                <tr @click="openDetails(row)">
                                    <td x-text="row.code"></td>
                                    <td class="name-column" x-text="row.name"></td>
                                    <template x-if="chartMode === 'none'">
                                        <template x-for="col in columns.filter(c => !['code', 'name'].includes(c))"
                                            :key="col">
                                            <td class="" x-text="Utils.formatValue(row[col])"></td>
                                        </template>
                                    </template>
                                    <template x-if="chartMode !== 'none'">
                                        <td>
                                            <div class="chart-mode-cell" :id="'chart-container-' + row.code">
                                                <div class="chart-container"></div>
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav class="pagination">
                    <ul>
                        <li><button @click="prevPage" :disabled="page <= 1">前へ</button></li>
                        <li x-text="page + ' / ' + totalPages"></li>
                        <li><button @click="nextPage" :disabled="page >= totalPages">次へ</button></li>
                    </ul>
                </nav>
            </div>
        </template>
    </main>

    <!-- Details Modal -->
    <dialog :open="showDetails" @click.self="closeDetails()">
        <article>
            <header>
                <button aria-label="Close" @click="closeDetails()"></button>
                <h3>詳細情報</h3>
                <a x-show="selectedRow.code" :href="'/company?code=' + selectedRow.code" class="button"
                    style="margin-bottom: 0;">詳細ページへ</a>
            </header>
            <div id="chart-container" style="width: 100%; height: 400px;"></div>
            <dl class="details-grid">
                <template x-for="(value, key) in selectedRow" :key="key">
                    <div>
                        <dt x-text="key"></dt>
                        <dd x-text="Utils.formatValue(value)"></dd>
                    </div>
                </template>
            </dl>
        </article>
    </dialog>

    <script type="module" src="/src/pages/companies.ts"></script>
</body>

</html>
