<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companies - Stock Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/styles/custom.css">
    <link rel="icon" href="/favicon.ico">
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body x-data="companiesPage" x-init="init()">
    <div class="mobile-header">
        <button class="outline secondary" @click="$store.ui.toggleSidebar()" style="margin-bottom: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <h3 style="margin: 0; font-size: 1.2rem;"><a href="/" style="color: inherit; text-decoration: none;">Stock
                Viewer</a></h3>
        <div style="width: 42px;"></div><!-- Spacer -->
    </div>

    <div class="sidebar-overlay" :class="$store.ui.sidebarOpen ? 'open' : ''" @click="$store.ui.closeSidebar()"></div>

    <nav class="sidebar" :class="$store.ui.sidebarOpen ? 'open' : ''" x-data="sidebar" x-init="init()">
        <header style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <h2><a href="/" style="color: inherit; text-decoration: none;">Stock Viewer</a></h2>
            <button class="outline secondary mobile-only" @click="$store.ui.closeSidebar()"
                style="border: none; padding: 0.5rem; display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>
        <ul>
            <template x-for="table in tables" :key="table">
                <li>
                    <button class="outline" :class="table === 'companies' ? '' : 'secondary'"
                        @click="navigate(table); $store.ui.closeSidebar()" x-text="table"></button>
                </li>
            </template>
            <li>
                <button class="outline secondary" @click="window.location.href='/candlestick.html'; $store.ui.closeSidebar()">日足チャート</button>
            </li>
        </ul>
    </nav>

    <main>
        <header>
            <h1>企業一覧</h1>
        </header>

        <section class="filter-container">
            <div class="filter-row">
                <input type="search" x-model="filterQuery" @input.debounce.300ms="applyFilter()"
                    placeholder="銘柄コードまたは会社名で検索..." style="flex: 2; min-width: 250px;">

                <template x-for="type in ['market', 'sector33', 'sector17', 'scale']" :key="type">
                    <details class="dropdown" style="margin-bottom: 0;">
                        <summary
                            style="padding: 1rem 1rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); background: var(--pico-background-color); font-size: 0.8rem;">
                            <span
                                x-text="type === 'market' ? '市場' : type === 'sector33' ? '業種(33)' : type === 'sector17' ? '業種(17)' : '規模'"></span>
                            <span x-show="selectedFilters[type].length > 0"
                                x-text="'(' + selectedFilters[type].length + ')'"></span>
                        </summary>
                        <ul
                            style="position: absolute; z-index: 100; min-width: 250px; max-height: 300px; overflow-y: auto; background: var(--pico-background-color); border: 1px solid var(--pico-muted-border-color); padding: 0.5rem; list-style: none;">
                            <template x-for="option in filterOptions[type]" :key="option">
                                <li>
                                    <label style="padding: 0.25rem 0.5rem; margin-bottom: 0;">
                                        <input type="checkbox" :checked="selectedFilters[type].includes(option)"
                                            @change="toggleFilter(type, option)">
                                        <span x-text="option" style="font-size: 0.85rem;"></span>
                                    </label>
                                </li>
                            </template>
                        </ul>
                    </details>
                </template>

                <select x-model="chartMode" @change="onChartModeChange()"
                    style="flex: 1; min-width: 150px; margin-bottom: 0;">
                    <option value="none">チャート表示: なし</option>
                    <option value="daily">チャート表示: 日足</option>
                    <option value="weekly">チャート表示: 週足</option>
                    <option value="monthly">チャート表示: 月足</option>
                </select>
                <button type="button" class="secondary" @click="clearAllFilters()"
                    style="margin-bottom: 0;">クリア</button>
            </div>
        </section>

        <template x-if="loadingData">
            <p aria-busy="true">データ読み込み中...</p>
        </template>

        <template x-if="columns.length > 0">
            <div class="content-area">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>code</th>
                                <th class="name-column">name</th>
                                <template x-if="chartMode === 'none'">
                                    <template x-for="col in columns.filter(c => !['code', 'name'].includes(c))"
                                        :key="col">
                                        <th x-text="col"></th>
                                    </template>
                                </template>
                                <template x-if="chartMode !== 'none'">
                                    <th style="min-width: 450px;">チャート</th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="row in data" :key="row.code">
                                <tr @click="openDetails(row)">
                                    <td x-text="row.code"></td>
                                    <td class="name-column" x-text="row.name"></td>
                                    <template x-if="chartMode === 'none'">
                                        <template x-for="col in columns.filter(c => !['code', 'name'].includes(c))"
                                            :key="col">
                                            <td class="" x-text="Utils.formatValue(row[col], col)"></td>
                                        </template>
                                    </template>
                                    <template x-if="chartMode !== 'none'">
                                        <td>
                                            <div class="chart-mode-cell" :id="'chart-container-' + row.code">
                                                <div class="chart-container"></div>
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav class="pagination">
                    <ul>
                        <li><button @click="prevPage" :disabled="page <= 1">前へ</button></li>
                        <li x-text="page + ' / ' + totalPages"></li>
                        <li><button @click="nextPage" :disabled="page >= totalPages">次へ</button></li>
                    </ul>
                </nav>
            </div>
        </template>
    </main>

    <!-- Details Modal -->
    <dialog :open="showDetails" @click.self="closeDetails()">
        <article>
            <header>
                <h3 style="margin-bottom: 0;">詳細情報</h3>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <a x-show="selectedRow.code" :href="'/company.html?code=' + selectedRow.code"
                        class="button outline secondary"
                        style="margin-bottom: 0; font-size: 0.8rem; padding: 0.25rem 0.75rem;">詳細ページへ</a>
                    <button class="modal-close-btn" aria-label="Close" @click="closeDetails()">×</button>
                </div>
            </header>
            <div id="chart-container" style="width: 100%; height: 400px;"></div>
            <dl class="details-grid">
                <template x-for="(value, key) in selectedRow" :key="key">
                    <div>
                        <dt x-text="key"></dt>
                        <dd x-text="Utils.formatValue(value, key)"></dd>
                    </div>
                </template>
            </dl>
        </article>
    </dialog>

    <script type="module" src="/src/pages/companies.ts"></script>
</body>

</html>
