<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDINET - Stock Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/styles/custom.css">
    <link rel="icon" href="/favicon.ico">
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body x-data="tablePage" x-init="init()">
    <nav class="sidebar" x-data="sidebar" x-init="init()">
        <h2>Stock Viewer</h2>
        <ul>
            <template x-for="table in tables" :key="table">
                <li>
                    <button class="outline" :class="table === 'edinet' ? '' : 'secondary'" @click="navigate(table)"
                        x-text="table"></button>
                </li>
            </template>
        </ul>
    </nav>
    <main>
        <header>
            <h1>EDINET</h1>
        </header>
        <template x-if="loadingData">
            <p aria-busy="true">読み込み中...</p>
        </template>

        <div class="filter-row" style="margin-bottom: 1rem; display: flex; gap: 1rem; align-items: flex-end;">
            <div style="flex: 0 0 200px;">
                <label for="vectorTarget" style="margin-bottom: 0.5rem; font-size: 0.8rem;">検索対象セクション</label>
                <select id="vectorTarget" x-model="vectorTarget" style="margin-bottom: 0;">
                    <option value="business_policy">経営方針・環境</option>
                    <option value="business_risks">事業等のリスク</option>
                    <option value="mda">MD&A（財政状態分析）</option>
                    <option value="business_description">事業の内容</option>
                    <option value="company_history">沿革</option>
                    <option value="research_and_development">研究開発活動</option>
                    <option value="corporate_governance">コーポレートガバナンス</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label for="vectorQuery" style="margin-bottom: 0.5rem; font-size: 0.8rem;">検索キーワード・文章</label>
                <input id="vectorQuery" type="text" x-model="vectorQuery" placeholder="文章で検索（例: 半導体不足の影響）"
                    @keyup.enter="applyVectorSearch()" style="margin-bottom: 0;">
            </div>
            <button @click="applyVectorSearch()" style="white-space: nowrap; margin-bottom: 0;">ベクトル検索</button>
        </div>

        <template x-if="columns.length > 0">
            <div class="content-area">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><template x-for="col in displayedColumns" :key="col">
                                    <th x-text="col"></th>
                                </template></tr>
                        </thead>
                        <tbody><template x-for="(row, index) in data" :key="row.docId || index">
                                <tr @click="openDetails(row)" style="cursor: pointer;"><template
                                        x-for="col in displayedColumns" :key="col">
                                        <td>
                                            <div class="line-clamp" x-text="Utils.formatValue(row[col])"></div>
                                        </td>
                                    </template></tr>
                            </template></tbody>
                    </table>
                </div>
                <nav class="pagination">
                    <ul>
                        <li><button @click="prevPage" :disabled="page <= 1">前へ</button></li>
                        <li x-text="page + ' / ' + totalPages"></li>
                        <li><button @click="nextPage" :disabled="page >= totalPages">次へ</button></li>
                    </ul>
                </nav>
            </div>
        </template>
    </main>
    <dialog :open="showDetails" @click.self="closeDetails()">
        <article>
            <header><button aria-label="Close" @click="closeDetails()"></button>
                <h3>詳細情報</h3>
                <a x-show="selectedRow.code" :href="'/company?code=' + selectedRow.code" class="button"
                    style="margin-bottom: 0;">詳細ページへ</a>
            </header>
            <dl class="details-grid"><template x-for="(value, key) in selectedRow" :key="key">
                    <template x-if="!key.endsWith('_vector')">
                        <div>
                            <dt x-text="key"></dt>
                            <dd x-text="Utils.formatValue(value)"></dd>
                        </div>
                    </template>
                </template></dl>
        </article>
    </dialog>
    <script type="module" src="/src/pages/edinet.ts"></script>
</body>

</html>
