<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock DuckDB Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/styles/custom.css">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" href="/favicon.ico">
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body x-data="tablePage" x-init="init()">
    <nav class="sidebar" x-data="sidebar" x-init="init()">
        <h2>Stock Viewer</h2>
        <template x-if="loadingTables">
            <p aria-busy="true">読み込み中...</p>
        </template>
        <ul>
            <template x-for="table in tables" :key="table">
                <li>
                    <button class="outline" :class="table === currentTable ? '' : 'secondary'" @click="navigate(table)"
                        x-text="table"></button>
                </li>
            </template>
        </ul>
    </nav>

    <main>
        <header>
            <h1 x-text="currentTable || 'テーブルを選択してください'"></h1>
        </header>

        <template x-if="loadingData">
            <p aria-busy="true">データ読み込み中...</p>
        </template>

        <template x-if="currentTable && columns.length > 0">
            <div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <template x-for="col in columns" :key="col">
                                    <th x-text="col"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="row in data" :key="JSON.stringify(row)">
                                <tr @click="openDetails(row)">
                                    <template x-for="col in columns" :key="col">
                                        <td x-text="Utils.formatValue(row[col])"></td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav class="pagination">
                    <ul>
                        <li><button @click="prevPage" :disabled="page <= 1">前へ</button></li>
                        <li x-text="page + ' / ' + totalPages"></li>
                        <li><button @click="nextPage" :disabled="page >= totalPages">次へ</button></li>
                    </ul>
                </nav>
            </div>
        </template>
    </main>

    <!-- Details Modal -->
    <dialog :open="showDetails" @click.self="closeDetails()">
        <article>
            <header>
                <button aria-label="Close" @click="closeDetails()"></button>
                <h3>詳細情報</h3>
                <a x-show="selectedRow.code" :href="'/company?code=' + selectedRow.code" class="button"
                    style="margin-bottom: 0;">詳細ページへ</a>
            </header>
            <div id="chart-container" style="width: 100%; height: 400px;" x-show="isPriceData"></div>
            <dl>
                <template x-for="(value, key) in selectedRow" :key="key">
                    <dt x-text="key"></dt>
                    <dd x-text="Utils.formatValue(value)"></dd>
                </template>
            </dl>
        </article>
    </dialog>

    <script type="module" src="/src/pages/index.ts"></script>
</body>

</html>
