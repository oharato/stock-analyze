<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock DuckDB Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/styles/custom.css">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" href="/favicon.ico">
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body x-data="tablePage" x-init="init()">
    <div class="mobile-header">
        <button class="outline secondary" @click="$store.ui.toggleSidebar()" style="margin-bottom: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <h3 style="margin: 0; font-size: 1.2rem;"><a href="/" style="color: inherit; text-decoration: none;">Stock
                Viewer</a></h3>
        <div style="width: 42px;"></div><!-- Spacer -->
    </div>

    <div class="sidebar-overlay" :class="$store.ui.sidebarOpen ? 'open' : ''" @click="$store.ui.closeSidebar()"></div>

    <nav class="sidebar" :class="$store.ui.sidebarOpen ? 'open' : ''" x-data="sidebar" x-init="init()">
        <header style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <h2><a href="/" style="color: inherit; text-decoration: none;">Stock Viewer</a></h2>
            <button class="outline secondary mobile-only" @click="$store.ui.closeSidebar()"
                style="border: none; padding: 0.5rem; display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>
        <template x-if="loadingTables">
            <p aria-busy="true">読み込み中...</p>
        </template>
        <ul>
            <template x-for="table in tables" :key="table">
                <li>
                    <button class="outline" :class="table === currentTable ? '' : 'secondary'"
                        @click="navigate(table); $store.ui.closeSidebar()" x-text="table"></button>
                </li>
            </template>
        </ul>
    </nav>

    <main>
        <header>
            <h1 x-text="currentTable || 'テーブルを選択してください'"></h1>
        </header>

        <template x-if="loadingData">
            <p aria-busy="true">データ読み込み中...</p>
        </template>

        <template x-if="currentTable && columns.length > 0">
            <div class="content-area">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <template x-for="col in columns" :key="col">
                                    <th x-text="col"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="row in data" :key="JSON.stringify(row)">
                                <tr @click="openDetails(row)">
                                    <template x-for="col in columns" :key="col">
                                        <td x-text="Utils.formatValue(row[col], col)"></td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav class="pagination">
                    <ul>
                        <li><button @click="prevPage" :disabled="page <= 1">前へ</button></li>
                        <li x-text="page + ' / ' + totalPages"></li>
                        <li><button @click="nextPage" :disabled="page >= totalPages">次へ</button></li>
                    </ul>
                </nav>
            </div>
        </template>
    </main>

    <!-- Details Modal -->
    <dialog :open="showDetails" @click.self="closeDetails()">
        <article>
            <header>
                <h3 style="margin-bottom: 0;">詳細情報</h3>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <a x-show="selectedRow.code" :href="'/company.html?code=' + selectedRow.code"
                        class="button outline secondary"
                        style="margin-bottom: 0; font-size: 0.8rem; padding: 0.25rem 0.75rem;">詳細ページへ</a>
                    <button class="modal-close-btn" aria-label="Close" @click="closeDetails()">×</button>
                </div>
            </header>
            <div id="chart-container" style="width: 100%; height: 400px;" x-show="isPriceData"></div>
            <dl class="details-grid">
                <template x-for="(value, key) in selectedRow" :key="key">
                    <div>
                        <dt x-text="key"></dt>
                        <dd x-text="Utils.formatValue(value, key)"></dd>
                    </div>
                </template>
            </dl>
        </article>
    </dialog>

    <script type="module" src="/src/pages/index.ts"></script>
</body>

</html>
