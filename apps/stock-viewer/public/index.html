<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock DuckDB Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/custom.css">
    <script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body x-data="app">

    <nav class="sidebar">
        <h2>Stock Viewer</h2>
        <template x-if="loadingTables">
            <p class="loading">テーブル読み込み中...</p>
        </template>
        <ul>
            <template x-for="table in tables" :key="table">
                <li>
                    <button @click="loadTable(table)" :class="{'contrast': currentTable === table}"
                        x-text="table"></button>
                </li>
            </template>
        </ul>
    </nav>

    <main>
        <header>
            <h1 x-text="currentTable || 'テーブルを選択してください'"></h1>
        </header>

        <template x-if="loadingData">
            <p class="loading">データ読み込み中...</p>
        </template>
        <template x-if="currentTable && columns.length > 0">
            <div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <template x-for="col in columns" :key="col">
                                    <th x-text="col"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="row in data" :key="JSON.stringify(row)">
                                <tr @click="openDetails(row)">
                                    <template x-for="col in columns" :key="col">
                                        <td x-text="formatValue(row[col])"></td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination">
                    <button @click="prevPage" :disabled="page <= 1">前へ</button>
                    <span x-text="`ページ ${page} / ${totalPages} (全 ${totalRecords} 件)`"></span>
                    <button @click="nextPage" :disabled="page >= totalPages">次へ</button>
                </div>
            </div>
        </template>
    </main>

    <!-- Details Modal -->
    <dialog @click.self="closeDetails()">
        <article>
            <header>
                <button aria-label="Close" @click="closeDetails()"></button>
                <h3>詳細情報</h3>
            </header>

            <!-- Chart -->
            <div id="chart-container" style="width: 100%; height: 400px;"></div>

            <!-- Details -->
            <dl>
                <template x-for="(value, key) in selectedRow" :key="key">
                    <template x-if="true">
                        <dt x-text="key"></dt>
                    </template>
                    <template x-if="true">
                        <dd x-text="formatValue(value)"></dd>
                    </template>
                </template>
            </dl>
        </article>
    </dialog>

    <script type="module" src="/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
