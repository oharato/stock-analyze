<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock DuckDB Viewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased h-screen flex overflow-hidden" x-data="app()">
    
    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-xl font-bold text-blue-400">Stock Viewer</h1>
        </div>
        <div class="flex-1 overflow-y-auto">
            <template x-if="loadingTables">
                <div class="p-4 text-gray-400">Loading tables...</div>
            </template>
            <ul class="p-2">
                <template x-for="table in tables" :key="table">
                    <li>
                        <button 
                            @click="loadTable(table)"
                            :class="{'bg-blue-600 text-white': currentTable === table, 'text-gray-300 hover:bg-gray-700': currentTable !== table}"
                            class="w-full text-left px-4 py-2 rounded-md transition-colors mb-1"
                            x-text="table"
                        ></button>
                    </li>
                </template>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- Header -->
        <div class="h-16 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-6">
            <h2 class="text-xl font-semibold" x-text="currentTable || 'Select a table'"></h2>
            <div x-show="currentTable" class="flex items-center space-x-4">
                <span class="text-sm text-gray-400" x-text="`Total: ${totalRecords}`"></span>
                <div class="flex items-center space-x-2">
                    <button @click="prevPage" :disabled="page <= 1" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 disabled:opacity-50">Prev</button>
                    <span class="text-sm" x-text="`Page ${page} of ${totalPages}`"></span>
                    <button @click="nextPage" :disabled="page >= totalPages" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 disabled:opacity-50">Next</button>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-6 relative">
            
            <!-- Loading Overlay -->
            <div x-show="loadingData" class="absolute inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-10">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
            </div>

            <!-- Table View -->
            <div x-show="currentTable && columns.length > 0" class="bg-gray-800 rounded-lg shadow overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-700">
                        <thead class="bg-gray-700">
                            <tr>
                                <template x-for="col in columns" :key="col">
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider" x-text="col"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody class="bg-gray-800 divide-y divide-gray-700">
                            <template x-for="(row, idx) in data" :key="idx">
                                <tr class="hover:bg-gray-750 cursor-pointer" @click="openDetails(row)">
                                    <template x-for="col in columns" :key="col">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">
                                            <div class="truncate max-w-xs" x-text="formatValue(row[col])"></div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Empty State -->
            <div x-show="!currentTable" class="h-full flex flex-col items-center justify-center text-gray-500">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                <p class="text-xl">Select a table to view data</p>
            </div>
        </div>
    </div>

    <!-- Details Modal / Slide-over -->
    <div x-show="showDetails" x-cloak class="fixed inset-0 overflow-hidden z-20" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 overflow-hidden">
            <div x-show="showDetails" x-transition:enter="ease-in-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in-out duration-500" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="absolute inset-0 bg-gray-900 bg-opacity-75 transition-opacity" @click="showDetails = false"></div>

            <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
                <div x-show="showDetails" x-transition:enter="transform transition ease-in-out duration-500 sm:duration-700" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transform transition ease-in-out duration-500 sm:duration-700" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full" class="pointer-events-auto w-screen max-w-2xl">
                    <div class="flex h-full flex-col overflow-y-scroll bg-gray-800 shadow-xl border-l border-gray-700">
                        <div class="px-4 sm:px-6 py-6 border-b border-gray-700 flex justify-between items-center">
                            <h2 class="text-lg font-medium text-white" id="slide-over-title">Row Details</h2>
                            <button @click="showDetails = false" type="button" class="rounded-md bg-gray-800 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white">
                                <span class="sr-only">Close panel</span>
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </div>
                        <div class="relative mt-6 flex-1 px-4 sm:px-6">
                            
                            <!-- Chart Container (Only for Prices) -->
                            <div x-show="isPriceData" class="mb-6 h-64 w-full bg-gray-900 rounded border border-gray-700" id="chart-container"></div>

                            <dl class="divide-y divide-gray-700">
                                <template x-for="(value, key) in selectedRow" :key="key">
                                    <div class="px-4 py-3 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
                                        <dt class="text-sm font-medium leading-6 text-gray-400" x-text="key"></dt>
                                        <dd class="mt-1 text-sm leading-6 text-white sm:col-span-2 sm:mt-0 break-words" x-text="formatValue(value)"></dd>
                                    </div>
                                </template>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                tables: [],
                currentTable: null,
                loadingTables: false,
                loadingData: false,
                data: [],
                columns: [],
                page: 1,
                limit: 50,
                totalRecords: 0,
                totalPages: 0,
                showDetails: false,
                selectedRow: {},
                chart: null,
                candlestickSeries: null,

                async init() {
                    await this.fetchTables();
                    // Handle window resize for chart
                    window.addEventListener('resize', () => {
                        if (this.chart) {
                            const container = document.getElementById('chart-container');
                            if(container) {
                                this.chart.resize(container.clientWidth, container.clientHeight);
                            }
                        }
                    });
                },

                async fetchTables() {
                    this.loadingTables = true;
                    try {
                        const res = await fetch('/api/tables');
                        this.tables = await res.json();
                    } catch (e) {
                        console.error("Failed to fetch tables", e);
                    } finally {
                        this.loadingTables = false;
                    }
                },

                async loadTable(table, page = 1) {
                    if (this.currentTable !== table) {
                        this.page = 1;
                        this.currentTable = table;
                    } else {
                        this.page = page;
                    }
                    
                    this.loadingData = true;
                    try {
                        const res = await fetch(`/api/table/${table}?page=${this.page}&limit=${this.limit}`);
                        const result = await res.json();
                        this.data = result.data;
                        this.columns = result.columns;
                        this.totalRecords = result.total;
                        this.totalPages = result.totalPages;
                    } catch (e) {
                        console.error("Failed to fetch data", e);
                    } finally {
                        this.loadingData = false;
                    }
                },

                prevPage() {
                    if (this.page > 1) {
                        this.loadTable(this.currentTable, this.page - 1);
                    }
                },

                nextPage() {
                    if (this.page < this.totalPages) {
                        this.loadTable(this.currentTable, this.page + 1);
                    }
                },

                formatValue(val) {
                    if (val === null || val === undefined) return '-';
                    if (typeof val === 'object') return JSON.stringify(val);
                    return val;
                },

                async openDetails(row) {
                    this.selectedRow = row;
                    this.showDetails = true;
                    
                    // Logic to load chart if appropriate
                    // If table is prices OR we can find related price data
                    // For now, let's assume if the row has a 'code', we can fetch prices for that code
                    // But wait, the main 'prices' table has many rows.
                    // If we are VIEWING 'prices' table, clicking a row is just one day. 
                    // To show a chart, we need historical data for that code.
                    
                    if (row.code || (this.currentTable === 'prices' && row.code)) {
                        await this.loadChart(row.code);
                    } else {
                        this.destroyChart();
                    }
                },

                get isPriceData() {
                   return !!this.selectedRow.code; 
                },

                async loadChart(code) {
                    this.$nextTick(async () => {
                        const container = document.getElementById('chart-container');
                        if (!container) return;

                        // Fetch price data for this code
                        // We need a new API endpoint for this or use the query endpoint
                        // Let's use the query endpoint for flexibility
                        const sql = `SELECT date, open, high, low, close, volume FROM prices WHERE code = '${code}' ORDER BY date ASC`;
                        try {
                            const res = await fetch(`/api/query?sql=${encodeURIComponent(sql)}`);
                            const priceData = await res.json();
                            
                            // Transform data for Lightweight Charts
                            // prices table has date as bigint (YYYYMMDD or timestamp?)
                            // Let's check schema... prices schema says date is bigint. Usually YYYYMMDD or unix? 
                            // Wait, in DuckDB imports it might be just numbers. 
                            // If it is YYYYMMDD, we need to parse it.
                            
                            const chartData = priceData.map(d => {
                                // Simple heuristic for date format
                                let dateStr = String(d.date);
                                if (dateStr.length === 8) {
                                    // YYYYMMDD
                                    const year = dateStr.substring(0, 4);
                                    const month = dateStr.substring(4, 6);
                                    const day = dateStr.substring(6, 8);
                                    return {
                                        time: `${year}-${month}-${day}`,
                                        open: d.open,
                                        high: d.high,
                                        low: d.low,
                                        close: d.close
                                    };
                                }
                                // Fallback or other formats would need handling
                                return {
                                    time: d.date, // might fail if not valid
                                    open: d.open,
                                    high: d.high,
                                    low: d.low,
                                    close: d.close
                                };
                            });

                            // Initialize Chart if not already
                            if (!this.chart) {
                                this.chart = LightweightCharts.createChart(container, {
                                    layout: {
                                        background: { type: 'solid', color: '#111827' },
                                        textColor: '#D1D5DB',
                                    },
                                    grid: {
                                        vertLines: { color: '#374151' },
                                        horzLines: { color: '#374151' },
                                    },
                                    width: container.clientWidth,
                                    height: container.clientHeight,
                                });
                                this.candlestickSeries = this.chart.addCandlestickSeries({
                                    upColor: '#26a69a', 
                                    downColor: '#ef5350', 
                                    borderVisible: false, 
                                    wickUpColor: '#26a69a', 
                                    wickDownColor: '#ef5350' 
                                });
                            }
                            
                            this.candlestickSeries.setData(chartData);
                            this.chart.timeScale().fitContent();

                        } catch (e) {
                            console.error("Failed to load chart data", e);
                        }
                    });
                },

                destroyChart() {
                    if (this.chart) {
                        this.chart.remove();
                        this.chart = null;
                        this.candlestickSeries = null;
                        document.getElementById('chart-container').innerHTML = ''; 
                    }
                }
            }
        }
    </script>
</body>
</html>
